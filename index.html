    <!-- Google Tag Manager / GA4 DataLayer Initialization -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      // Read runtime tracking configuration from localStorage or server pre-init
      (function() {
        try {
          var raw = localStorage.getItem('outpost_analytics_config');
          if (raw) {
            var cfg = JSON.parse(raw);
            if (cfg.gscVerificationCode) {
              var meta = document.getElementById('gsc-meta-tag');
              if (meta) meta.setAttribute('content', cfg.gscVerificationCode);
            }
            if (cfg.ga4MeasurementId) {
              var gaScript = document.createElement('script');
              gaScript.id = 'ga4-script';
              gaScript.async = true;
              gaScript.src = 'https://www.googletagmanager.com/gtag/js?id=' + encodeURIComponent(cfg.ga4MeasurementId);
              document.head.appendChild(gaScript);
              gtag('config', cfg.ga4MeasurementId, { send_page_view: true });
            }
            if (cfg.gtmContainerId) {
              (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
              new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
              j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
              'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
              })(window,document,'script','dataLayer',cfg.gtmContainerId);
            }
          }
        } catch(e) { console.warn('Analytics pre-loader error', e); }
      })();
    </script>
